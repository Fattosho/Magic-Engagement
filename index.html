
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Engagement | Domine o Jogo do Engajamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Satisfy&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-red: #d60000;
        --brand-red-light: #ff1a1a;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #ffffff;
        overflow-x: hidden;
        width: 100%;
      }
      .font-logo-script {
        font-family: 'Satisfy', cursive;
      }
      .logo-red-gradient {
        background: radial-gradient(circle at center, #ff0000 0%, #8b0000 100%);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(214, 0, 0, 0.2);
      }

      /* Neon Pulse Animation */
      @keyframes neon-pulse {
        0%, 100% {
          box-shadow: 0 0 10px rgba(214, 0, 0, 0.6), 0 0 20px rgba(214, 0, 0, 0.4);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 25px rgba(214, 0, 0, 0.9), 0 0 50px rgba(214, 0, 0, 0.6);
          transform: scale(1.02);
        }
      }

      .btn-neon {
        animation: neon-pulse 1.5s infinite ease-in-out;
        border: 1px solid var(--brand-red-light);
      }

      /* Animation Classes */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity;
      }
      
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      .reveal-left {
        opacity: 0;
        transform: translateX(-30px);
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .reveal-left.active {
        opacity: 1;
        transform: translateX(0);
      }

      .reveal-right {
        opacity: 0;
        transform: translateX(30px);
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .reveal-right.active {
        opacity: 1;
        transform: translateX(0);
      }

      .reveal-delay-1 { transition-delay: 100ms; }
      .reveal-delay-2 { transition-delay: 200ms; }
      .reveal-delay-3 { transition-delay: 300ms; }
      .reveal-delay-4 { transition-delay: 400ms; }

      /* Prevenir quebra de palavras em headers */
      h1, h2 {
        word-break: break-word;
        hyphens: none;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--brand-red);
        border-radius: 4px;
      }
    </style>

</head>

    <div id="root"></div>
  </body>
</html>
